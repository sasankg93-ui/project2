global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api            # queue depth, job transitions, HTTP latency
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: workers        # worker CPU / memory (scale with: docker compose up --scale ...)
    dns_sd_configs:
      - names: ["worker-images", "worker-video"]
        type: A
        port: 9101
  - job_name: rabbitmq       # native RabbitMQ metrics (plugin is enabled in the official image)
    static_configs: [{ targets: ["rabbitmq:15692"] }]
